[package]
name = "s4-index"
version = "0.0.0"
edition = "2021"
publish = false
description = "Spike S4: Rust index (SQLite FTS5 + file watcher), throwaway"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
pulldown-cmark = { version = "0.13", default-features = false }
yaml-rust2 = "0.13"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
rayon = "1"
notify = "8"
tempfile = "3"

[dev-dependencies]
gen-vault = { path = "../../tools/gen-vault" }
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "perf"
harness = false

[profile.release]
debug = 1

[profile.bench]
debug = 1
