<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tegg S3</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="main">
      <h1 data-i18n="main.title">Tegg S3: platform spike</h1>
      <p class="hint" data-i18n="main.hint">Close this window. Capture still works from the menu bar, ⌃⌥Space and ⌃⌥T.</p>
      <dl>
        <dt data-i18n="main.vault">Vault</dt><dd id="vault" aria-label="Vault path"></dd>
        <dt data-i18n="main.timings">Timings</dt><dd id="timings"></dd>
      </dl>
      <h2 data-i18n="main.captures">Captured files</h2>
      <ul id="files" aria-label="Captured files"></ul>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
