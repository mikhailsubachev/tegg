# Its own workspace root: the core's `Cargo.toml` excludes `app`, and Cargo would otherwise walk up past a nested worktree
# (`.claude/worktrees/<name>/`) to the main checkout's manifest, whose excludes depend on its branch (open item 19).
[workspace]

[package]
name = "tegg-app"
version = "0.0.0"
edition = "2021"
publish = false
description = "Tegg shell (macOS and Android): windows, IPC to tegg-core, events (docs/contracts/ms2-shell.md, android-shell.md, architecture §3.3)"

[lib]
name = "tegg_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tegg"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tegg-core = { path = "../../crates/tegg-core" }
tegg-vault = { path = "../../crates/tegg-vault" }
tegg-schema = { path = "../../crates/tegg-schema" }
tegg-format = { path = "../../crates/tegg-format" }
# Slice I2 (v1-import-window §1): the Capacities import engine; BLAKE3 for the scan memo (§1.3).
tegg-import = { path = "../../crates/tegg-import" }
blake3 = "1"
# `test`: the mock runtime of `acl_probe` (D-570, NFR-SEC-03 AC-2); `tray-icon`, `image-png`: the status item (§1.4).
# `macos-private-api` stays here: tauri-build checks this entry against tauri.conf.json's `macOSPrivateApi` (a no-op on
# Android); `tray-icon` is desktop-only below.
tauri = { version = "2", features = ["image-png", "test", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
ts-rs = "10"
libc = "0.2"

# The desktop only (AR-03 AC-7, android-shell §1): the status item, the private macOS API, the folder dialog.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "test", "macos-private-api"] }
tauri-plugin-dialog = "2"

# Android only (D-2018): the Kotlin side of the shell.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-tegg-android = { path = "tegg-android" }

# macOS: the mouse back/forward buttons, which WKWebView doesn't pass to the page (FR-NAV-03).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "block2", "NSApplication", "NSResponder"] }
block2 = "0.6"

[profile.release]
strip = true
lto = true

# Dependencies optimized in debug builds too (as in the core workspace).
[profile.dev.package."*"]
opt-level = 2

[features]
# The release build (D-118, D-1514): installs as Tegg.app with its own bundle id and Application Support folder.
preview = []
