[package]
name = "tegg-core"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Tegg core façade: vault + index + watcher + events (docs/contracts/ms2-core.md §3)"

[dependencies]
tegg-format = { path = "../tegg-format" }
tegg-vault = { path = "../tegg-vault" }
tegg-index = { path = "../tegg-index" }
tegg-schema = { path = "../tegg-schema" }
tegg-jobs = { path = "../tegg-jobs" }
chrono.workspace = true
chrono-tz.workspace = true
serde_json.workspace = true
yaml-rust2 = "0.13"
# v1-queries §1.6 (D-1450): ICU4X collation (compiled data) for query sorting, the twin of the UI's `Intl.Collator`.
icu_collator = "2.3"
icu_locale_core = "2.3"

[features]
# ms4-daily §1: test-only helpers (`daily::window`).
test-hooks = ["tegg-index/test-hooks"]

[dev-dependencies]
tegg-core = { path = ".", features = ["test-hooks"] }
tegg-schema = { path = "../tegg-schema" }
tempfile.workspace = true
gen-vault = { path = "../../tools/gen-vault" }
tegg-vault = { path = "../tegg-vault" }
tegg-index = { path = "../tegg-index", features = ["test-hooks"] }
tegg-format = { path = "../tegg-format" }
chrono.workspace = true
chrono-tz.workspace = true
serde_json.workspace = true
