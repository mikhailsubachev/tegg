[package]
name = "tegg-index"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Tegg core: SQLite + FTS5 index, search, quick switcher, conflicts (docs/contracts/ms2-core.md §2)"

[dependencies]
tegg-format = { path = "../tegg-format" }
tegg-vault = { path = "../tegg-vault" }
chrono.workspace = true
chrono-tz.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
unicode-normalization = "0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }

[features]
# v1-graph §1.5 (G1): the L4 pause hook of `GraphRequest` (FR-GRP-01 AC-9).
test-hooks = []

[dev-dependencies]
# v1-related §1.13 (slice REL): the generated vaults of FR-LNK-15 AC-3 and NFR-PERF-13 AC-1.
gen-vault = { path = "../../tools/gen-vault" }
tegg-index = { path = ".", features = ["test-hooks"] }
tempfile.workspace = true
tegg-vault = { path = "../tegg-vault" }
chrono.workspace = true
chrono-tz.workspace = true
